services:
  valkey:
    ports:
      - "127.0.0.1:6379:6379"
  worker:
    command: node ./lib/worker.ts --watch
    volumes:
      - ./lib:/app/lib
  frontend:
    command: yarn vite dev
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:3000:3000"
  mongodb:
    ports:
      - "127.0.0.1:27017:27017"
